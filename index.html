<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lift Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* Layout concept: phone-first app column (max 560px). Four tabs along the bottom,
   the live workout is a full-height sheet that can be minimised to a resume bar. */
:root{
  --font:system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#eaedf4; --line:#dde1ea;
  --fg:#12151c; --muted:#667085;
  --accent:#2f6bff; --accent-ink:#ffffff; --accent-soft:#e3ebff;
  --ok:#16a34a; --ok-soft:#dcf4e4; --warn:#b97800; --warn-soft:#fdf0d2; --danger:#d93a40; --danger-soft:#fde4e5;
  --shadow:0 1px 2px rgba(16,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d12; --surface:#151821; --surface2:#1e222d; --line:#282d3a;
  --fg:#eef0f6; --muted:#8b92a6;
  --accent:#5a8bff; --accent-ink:#0b0d12; --accent-soft:#17234a;
  --ok:#3ccf75; --ok-soft:#12301f; --warn:#f2b33d; --warn-soft:#382c10; --danger:#ff6b71; --danger-soft:#3a1517;
  --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b0d12; --surface:#151821; --surface2:#1e222d; --line:#282d3a;
  --fg:#eef0f6; --muted:#8b92a6;
  --accent:#5a8bff; --accent-ink:#0b0d12; --accent-soft:#17234a;
  --ok:#3ccf75; --ok-soft:#12301f; --warn:#f2b33d; --warn-soft:#382c10; --danger:#ff6b71; --danger-soft:#3a1517;
  --shadow:none; color-scheme:dark;}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);height:100%;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;margin:0;padding:0;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.mono{font-variant-numeric:tabular-nums}
.app{position:relative;display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:600px){.app{border-inline:1px solid var(--line)}}
.main{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 28px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
.ph h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:11px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent)}
.mini{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;background:var(--accent-soft);border-top:1px solid var(--line);text-align:left}
.mini .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.mini .mr{color:var(--accent);font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{min-height:36px;padding:0 14px;border-radius:10px;font-size:14px}
.btn.block{width:100%}
.btn.sec{background:var(--surface2);color:var(--fg)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.link{background:none;color:var(--danger);min-height:40px}
.btn[disabled]{opacity:.45;cursor:default}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted)}
.ib.acc{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;padding:12px 0;outline:0}
.field{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:12px 14px;outline:0}
.field:focus{border-color:var(--accent)}
label.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em;text-transform:uppercase}
/* history */
.month{font-size:13px;font-weight:700;color:var(--muted);margin:20px 0 8px}
.wk{display:block;width:100%;text-align:left}
.wk h3,.rt h3{font-size:17px;font-weight:700;margin:0}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 2px;font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:700}
.stats .pr{color:var(--warn)}
.exl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;margin-top:10px;font-size:14px}
.exl span:nth-child(even){color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{margin:0;font-size:18px}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.empty .ill{width:84px;height:84px;color:var(--accent)}
.skel{height:92px;border-radius:16px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sk 1.4s linear infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
/* routines */
.rt .meta{color:var(--muted);font-size:13px;margin:4px 0 12px}
.rt .names{color:var(--muted);font-size:13px;margin:6px 0 0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
/* sheets */
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.sheet.o{z-index:30}.sheet.o2{z-index:40}.sheet.o3{z-index:50}.sheet.o4{z-index:60}
.sh{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.sh h2{margin:0;flex:1;min-width:0;text-align:center;font-size:16px;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:700}
.sb{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 32px}
.clock{font-weight:700;color:var(--accent);min-width:3.4em;text-align:right}
.kpis{display:flex;gap:10px;margin-bottom:14px}
.kpi{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.kpi small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-size:18px;font-weight:800}
.kpi .sub{display:block}
.title-in{width:100%;background:none;border:0;border-bottom:1px solid var(--line);outline:0;font-size:22px;font-weight:800;padding:6px 0 8px;letter-spacing:-.01em}
.title-in:focus{border-color:var(--accent)}
.note-in{width:100%;background:none;border:0;outline:0;padding:8px 0;color:var(--muted);font-size:14px}
.rest{position:sticky;top:-14px;z-index:5;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:8px 8px 8px 14px;margin:0 0 14px;overflow:hidden}
.rest .t{font-weight:800;font-size:20px;min-width:3.2em}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.55);width:100%}
.rest button{background:rgba(255,255,255,.2);color:inherit;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px}
.rest .lab{flex:1;font-size:13px;font-weight:700;opacity:.9}
.ex{margin-top:14px;padding:12px 10px 10px}
.ex-h{display:flex;align-items:center;gap:6px;padding:0 4px}
.ex-n{flex:1;min-width:0;text-align:left;font-size:17px;font-weight:800;color:var(--accent)}
.ex .note-in{padding:6px 4px}
.srow{display:grid;gap:6px;align-items:center;padding:4px;border-radius:10px;margin-top:4px}
.srow.h{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-align:center;margin-top:2px}
.srow.done{background:var(--ok-soft)}
.srow input{width:100%;min-width:0;text-align:center;font-weight:700;background:var(--surface2);border:1px solid transparent;border-radius:9px;padding:8px 2px;outline:0;font-variant-numeric:tabular-nums}
.srow input:focus{border-color:var(--accent)}
.srow.done input{background:transparent}
.srow input::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.sn{height:34px;border-radius:9px;background:var(--surface2);font-weight:800;font-size:14px}
.sn.w{color:var(--warn)}.sn.d{color:var(--accent)}.sn.f{color:var(--danger)}
.pv{font-size:13px;color:var(--muted);text-align:center;font-weight:600;font-variant-numeric:tabular-nums;border-radius:8px;padding:8px 0}
button.pv:hover{background:var(--surface2)}
.chk{height:34px;border-radius:9px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--ok);color:#fff}
.addset{width:100%;margin-top:8px;min-height:38px;border-radius:10px;background:var(--surface2);font-weight:700;font-size:14px;color:var(--fg);display:flex;align-items:center;justify-content:center;gap:6px}
/* action sheet + modal */
.scrim{position:absolute;inset:0;z-index:70;background:rgba(5,8,15,.55);display:flex;align-items:flex-end;justify-content:center}
.scrim.mid{align-items:center;padding:20px}
.panel{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.scrim.mid .panel{border-radius:20px;padding:20px;max-width:380px;gap:12px}
.panel .opt{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:12px;font-weight:600;text-align:left;width:100%}
.panel .opt:hover{background:var(--surface2)}
.panel .opt.dng{color:var(--danger)}
.panel .opt[aria-current="true"]{color:var(--accent)}
.panel h3{margin:0;font-size:19px}
.panel p{margin:0;color:var(--muted)}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.trophy{color:var(--warn)}
.pr-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:999px}
.pick-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 10px;border-radius:12px}
.pick-row:hover{background:var(--surface2)}
.pick-row.sel{background:var(--accent-soft)}
.badge{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--muted);flex:none}
.pick-row.sel .badge{background:var(--accent);color:var(--accent-ink)}
.tbl{display:grid;grid-template-columns:2.4rem 1fr auto;gap:6px 10px;font-size:14px;font-variant-numeric:tabular-nums;margin-top:8px}
.tbl .hd{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.rec .kpi b{display:block;font-size:17px}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ct{fill:var(--muted);font-size:9px;font-family:var(--font);font-weight:600}
.chart .cv{fill:var(--fg);font-size:9.5px;font-family:var(--font);font-weight:800}
.chart .bar{fill:var(--accent);opacity:.35}.chart .bar.cur{opacity:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}.chart .pt.last{fill:var(--accent)}
.hb{display:grid;grid-template-columns:92px 1fr 2.2rem;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.hb i{display:block;height:9px;border-radius:5px;background:var(--surface2);overflow:hidden}
.hb i b{display:block;height:100%;background:var(--accent);border-radius:5px}
.hb span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big .kpi b{font-size:22px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--surface2);font-weight:800;font-size:18px}
.stepper b{min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
#toasts{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:560px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 16px}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.est{font-size:13px;color:var(--muted);margin:-4px 0 14px;font-variant-numeric:tabular-nums}
.est b{color:var(--fg)}
.mbar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;background:var(--surface);border-top:1px solid var(--line);min-height:57px;flex:none}
.mbar .open{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left;border-radius:10px}
.mbar .art{width:40px;height:40px;border-radius:8px;background:var(--surface2);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.mbar .mt{flex:1;min-width:0;line-height:1.25}
.mbar .mt b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .mt span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mbar .ib{width:38px;height:38px;color:var(--fg);border-radius:50%;flex:none}
.mbar .ib.pp{background:var(--accent);color:var(--accent-ink)}
body.typing .mbar{display:none}
.sw{width:48px;height:28px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-checked="true"]::after{left:22px}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
.set-row{display:flex;align-items:center;gap:12px;min-height:44px}
.set-row .grow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.lo{background:var(--warn-soft);color:var(--warn)}
.pill.hi{background:var(--accent-soft);color:var(--accent)}.pill.no{background:var(--surface2);color:var(--muted)}
.bm{width:100%;max-width:300px;height:auto;display:block;margin:0 auto}
.bm .n{fill:var(--surface2);opacity:.75}
.bm .m{fill:var(--surface2);stroke:var(--line);stroke-width:.8}
.bm .m.on{fill:var(--accent);fill-opacity:var(--o,1);stroke:var(--accent);stroke-opacity:.5}
.bm text{fill:var(--muted);font-size:7px;font-weight:700;letter-spacing:.08em;font-family:var(--font)}
.mrow{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mrow .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;min-width:2.6em}
.legend{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--muted);margin:6px 0 2px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:4px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.04em;padding-bottom:2px}
.cd{position:relative;aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--fg);background:transparent;border:1px solid transparent}
.cd.out{visibility:hidden}
.cd.has{background:var(--accent);color:var(--accent-ink);font-weight:800}
.cd.today{border-color:var(--accent)}
.cd.sel{box-shadow:0 0 0 2px var(--fg)}
.cd.future{color:var(--muted);opacity:.6}
.cd i{position:absolute;top:2px;right:3px;font-style:normal;font-size:9px;font-weight:800}
.wk7 .cd{aspect-ratio:auto;flex-direction:column;gap:3px;padding:10px 0;background:var(--surface2)}
.wk7 .cd.has{background:var(--accent)}
.wk7 .cd small{font-size:11px;font-weight:700;opacity:.75}
.calnav{display:flex;align-items:center;gap:6px;margin:0 0 12px}
.calnav b{flex:1;text-align:center;font-size:16px}
.yr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ym{display:block;text-align:left;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ym.cur{border-color:var(--accent)}
.ym .row{justify-content:space-between;margin-bottom:6px;font-size:13px}
.ym .row span{color:var(--muted);font-variant-numeric:tabular-nums}
.ym .ymg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ym .ymg i{display:block;aspect-ratio:1;border-radius:2px;background:var(--surface2)}
.ym .ymg i.on{background:var(--accent)}.ym .ymg i.out{visibility:hidden}
.cstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:14px}
.banner{background:var(--warn-soft);color:var(--fg);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:14px}
</style>
</head>
<body>
<div id="root"></div>
<!--CAP-->
<script>
(function(){
'use strict';
/* ---------- platform ---------- */
var CAP=window.Capacitor;
var NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
var Native=NATIVE&&CAP.registerPlugin?CAP.registerPlugin('LiftLog'):null;
if(!Native)NATIVE=false;

/* ---------- workout math ---------- */
function isWork(s){return s.t!=='w'}
function setVol(s,ty){return ty==='wr'?(s.w||0)*(s.r||0):0}
function e1rm(s){return (s.w>0&&s.r>0)?(s.r===1?s.w:s.w*(1+s.r/30)):0}
function totals(w,onlyDone){var v=0,n=0;w.exercises.forEach(function(ex){var ty=exOf(ex.ex).type;ex.sets.forEach(function(s){if(onlyDone&&!s.done)return;n++;if(isWork(s))v+=setVol(s,ty)})});return {vol:v,sets:n}}
function sessionsOf(exId,beforeStart,exceptId){var out=[];S.workouts.forEach(function(w){if(w.id===exceptId)return;if(beforeStart!=null&&w.start>=beforeStart)return;w.exercises.forEach(function(e){if(e.ex===exId)out.push({w:w,sets:e.sets})})});return out}
var prevCache=null;
function lastSets(exId){if(prevCache&&prevCache[exId])return prevCache[exId];var s=sessionsOf(exId,null,S.active&&S.active.id);var r=s.length?s[0].sets:[];if(prevCache)prevCache[exId]=r;return r}
function fmtSet(s,ty){if(!s)return '–';if(ty==='wr')return fmtW(s.w||0)+' × '+(s.r||0);if(ty==='dur')return fmtMS(s.r||0);return String(s.r||0)}
function bestSet(sets,ty){var b=null,bs=-1;sets.forEach(function(s){if(!isWork(s))return;var sc=ty==='wr'?(e1rm(s)||s.w||0):(s.r||0);if(sc>bs){bs=sc;b=s}});return b}
function setLabel(s,n){return s.t==='w'?'W':s.t==='d'?'D':s.t==='f'?'F':String(n)}
function calcPRs(w){
  var out=[];
  w.exercises.forEach(function(ex){
    var ty=exOf(ex.ex).type,prior=sessionsOf(ex.ex,w.start,w.id);
    ex.sets.forEach(function(s){delete s.pr});
    if(!prior.length)return;
    var bw=0,b1=0,bv=0,br=0;
    prior.forEach(function(p){p.sets.forEach(function(s){if(!isWork(s))return;bw=Math.max(bw,s.w||0);b1=Math.max(b1,e1rm(s));bv=Math.max(bv,setVol(s,'wr'));br=Math.max(br,s.r||0)})});
    ex.sets.forEach(function(s){
      if(!isWork(s))return;var k=[];
      if(ty==='wr'){
        if((s.r||0)>0){if((s.w||0)>bw)k.push('Weight');if(e1rm(s)>b1+1e-9)k.push('1RM');if(setVol(s,'wr')>bv+1e-9)k.push('Volume')}
        bw=Math.max(bw,s.w||0);b1=Math.max(b1,e1rm(s));bv=Math.max(bv,setVol(s,'wr'));
      }else{if((s.r||0)>br)k.push(ty==='dur'?'Time':'Reps');br=Math.max(br,s.r||0)}
      if(k.length){s.pr=k;out.push({ex:ex.ex,s:s,k:k})}
    });
  });
  return out;
}
/* auto warm-up: leading sets well below the working weight become W */
function autoWarm(ex){
  if(!S.profile.autoWarm||exOf(ex.ex).type!=='wr')return [];
  var ref=0;
  lastSets(ex.ex).forEach(function(s){if(isWork(s))ref=Math.max(ref,s.w||0)});
  ex.sets.forEach(function(s){if(s.done&&!(s.tManual&&s.t==='w'))ref=Math.max(ref,s.w||0)});
  if(!ref)return [];
  var changed=[];
  for(var i=0;i<ex.sets.length;i++){
    var s=ex.sets[i];
    if(s.tManual){if(s.t==='w')continue;break}
    if(!s.done)break;
    var light=(s.w||0)<=0.6*ref;
    if(light){if(s.t==='n'){s.t='w';s.tAuto=true;changed.push(i)}}
    else{if(s.tAuto&&s.t==='w'){s.t='n';delete s.tAuto}break}
  }
  return changed;
}
/* time estimate */
function histPace(){var h=S.workouts.filter(function(w){return w.sets>0&&w.dur>0}).slice(0,6).map(function(w){return w.dur/w.sets});return h.length?median(h):(S.profile.rest||90)+45}
function estimate(){
  var a=S.active,ticks=[],left=0;
  a.exercises.forEach(function(e){e.sets.forEach(function(s){if(s.done){if(s.at)ticks.push(s.at)}else left++})});
  ticks.sort(function(x,y){return x-y});
  var iv=[];for(var i=1;i<ticks.length;i++){var d=(ticks[i]-ticks[i-1])/1000;if(d>=10&&d<=900)iv.push(d)}
  var hp=histPace(),k=Math.min(iv.length/6,1),pace=iv.length?k*median(iv)+(1-k)*hp:hp;
  var now=Date.now(),base=ticks.length?ticks[ticks.length-1]:a.start;
  var fin=left?Math.max(base+left*pace*1000,now+(left-0.5)*pace*1000):now;
  return {left:left,fin:fin,secs:Math.max(0,(fin-now)/1000)};
}
function estText(){
  if(!S.active||S.active.kind!=='workout')return '';
  var e=estimate();
  if(!e.left)return S.active.exercises.length?'All sets logged. Tap <b>Finish</b> when you are done.':'Add exercises to see an estimated finish time.';
  return 'Est. finish <b>'+fTime(e.fin)+'</b> · about '+fmtShort(Math.max(60,e.secs))+' left · '+e.left+' set'+(e.left>1?'s':'')+' to go';
}

function muscleSets(ws,onlyDone){var c={};ws.forEach(function(w){w.exercises.forEach(function(ex){var m=musclesOf(ex.ex),n=ex.sets.filter(function(s){return isWork(s)&&(!onlyDone||s.done)}).length;if(!n)return;m.p.forEach(function(k){c[k]=(c[k]||0)+n});m.s.forEach(function(k){c[k]=(c[k]||0)+n*0.5})})});return c}

  return '<svg class="bm" viewBox="0 0 210 214" role="img" aria-label="Muscles worked, front and back"><g><g class="n">'+BODY_N+BODY_FN+'</g>'+grp(BODY_F)+'<text x="50" y="212" text-anchor="middle">FRONT</text></g><g transform="translate(110 0)"><g class="n">'+BODY_N+'</g>'+grp(BODY_B)+'<text x="50" y="212" text-anchor="middle">BACK</text></g></svg>';

function mapForCounts(c){var mx=0;DRAWN.forEach(function(m){mx=Math.max(mx,c[m]||0)});return bodyMap(function(m){return mx?(c[m]||0)/mx:0},function(m){return m+': '+fmtN(c[m]||0)+' sets'})}

/* ---------- calendar ---------- */
function dayStart(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function addDays(t,n){var d=new Date(t);d.setDate(d.getDate()+n);return d.getTime()}
function byDay(){var m={};S.workouts.forEach(function(w){var k=dayStart(w.start);(m[k]=m[k]||[]).push(w)});return m}
function inRange(a,b){return S.workouts.filter(function(w){return w.start>=a&&w.start<b})}
function weekStreak(){
  var wk=weekStart(Date.now()),n=0,has=function(t){return S.workouts.some(function(w){return w.start>=t&&w.start<addDays(t,7)})};
  if(!has(wk))wk=addDays(wk,-7);
  while(has(wk)){n++;wk=addDays(wk,-7)}
  return n;
}
function periodStats(ws,label){var d=0,v=0;ws.forEach(function(w){d+=w.dur||0;v+=w.vol||0});
  return '<div class="cstats">'+kpi('Workouts',ws.length)+kpi('Time',ws.length?fmtShort(d):'0m')+kpi('Volume ('+S.profile.unit+')',fmtVol(v).replace(' '+S.profile.unit,''))+'</div>'}
function calView(){
  var mode=S.cv,a=S.cd,days=byDay(),today=dayStart(Date.now()),h='';
  h+='<div class="seg" role="group" aria-label="Calendar range">'+[['week','Week'],['month','Month'],['year','Year']].map(function(x){return '<button data-act="cv" data-id="'+x[0]+'" aria-pressed="'+(mode===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>';
  var from,to,label,body='',list=null;
  if(mode==='week'){
    from=weekStart(a);to=addDays(from,7);
    label=fDateS(from)+' – '+fDateS(addDays(from,6));
    body='<div class="cal wk7">';
    for(var i=0;i<7;i++){var t=addDays(from,i),n=(days[t]||[]).length;
      body+='<button class="cd'+(n?' has':'')+(t===today?' today':'')+(t>today?' future':'')+(S.csel===t?' sel':'')+'" data-act="cday" data-id="'+t+'" aria-label="'+esc(fDate(t))+', '+n+' workout'+(n===1?'':'s')+'"><small>'+new Date(t).toLocaleDateString(undefined,{weekday:'short'})+'</small>'+new Date(t).getDate()+'</button>'}
    body+='</div>';
  }else if(mode==='month'){
    var d=new Date(a);d.setDate(1);d.setHours(0,0,0,0);from=d.getTime();var e=new Date(d);e.setMonth(e.getMonth()+1);to=e.getTime();
    label=d.toLocaleDateString(undefined,{month:'long',year:'numeric'});
    body='<div class="cal">'+['M','T','W','T','F','S','S'].map(function(x){return '<span class="wd">'+x+'</span>'}).join('');
    var lead=(d.getDay()+6)%7;for(var j=0;j<lead;j++)body+='<span class="cd out"></span>';
    for(var t2=from;t2<to;t2=addDays(t2,1)){var n2=(days[t2]||[]).length;
      body+='<button class="cd'+(n2?' has':'')+(t2===today?' today':'')+(t2>today?' future':'')+(S.csel===t2?' sel':'')+'" data-act="cday" data-id="'+t2+'" aria-label="'+esc(fDate(t2))+', '+n2+' workout'+(n2===1?'':'s')+'">'+new Date(t2).getDate()+(n2>1?'<i>'+n2+'</i>':'')+'</button>'}
    body+='</div>';
  }else{
    var y=new Date(a).getFullYear();from=new Date(y,0,1).getTime();to=new Date(y+1,0,1).getTime();label=String(y);
    var cm=new Date();body='<div class="yr">';
    for(var m=0;m<12;m++){var ms=new Date(y,m,1),me=new Date(y,m+1,1),cnt=inRange(ms.getTime(),me.getTime()).length;
      var mini='',ld=(ms.getDay()+6)%7;for(var k=0;k<ld;k++)mini+='<i class="out"></i>';
      for(var t3=ms.getTime();t3<me.getTime();t3=addDays(t3,1))mini+='<i'+(days[t3]?' class="on"':'')+'></i>';
      body+='<button class="ym'+(cm.getFullYear()===y&&cm.getMonth()===m?' cur':'')+'" data-act="cmonth" data-id="'+ms.getTime()+'"><div class="row"><b>'+ms.toLocaleDateString(undefined,{month:'short'})+'</b><span>'+cnt+'</span></div><div class="ymg">'+mini+'</div></button>'}
    body+='</div>';
  }
  var ws=inRange(from,to);
  h+='<div class="calnav"><button class="ib" data-act="cnav" data-d="-1" aria-label="Previous">'+I.left+'</button><b>'+esc(label)+'</b><button class="ib" data-act="cnav" data-d="1" aria-label="Next" style="transform:scaleX(-1)">'+I.left+'</button></div>';
  h+=periodStats(ws);
  h+='<div class="card">'+body+'</div>';
  var st=weekStreak();
  h+='<p class="sub" style="margin:10px 2px 0">'+(st?'Weekly streak: <b style="color:var(--fg)">'+st+' week'+(st>1?'s':'')+'</b> in a row with at least one workout.':'Train this week to start a weekly streak.')+' <button class="btn sm sec" style="min-height:30px;margin-left:6px" data-act="ctoday">Today</button></p>';
  if(mode!=='year'){
    var sel=S.csel!=null&&S.csel>=from&&S.csel<to?S.csel:null;
    var show=sel!=null?(days[sel]||[]):ws;
    var now=Date.now(),isNow=now>=from&&now<to;
    var title=sel!=null?fDate(sel):(mode==='week'?(isNow?'This week':'Workouts that week'):(isNow?'This month':'Workouts that month'));
    h+='<h2>'+esc(title)+'</h2>';
    h+=show.length?show.map(wCard).join(''):'<p class="sub">'+(sel!=null?'No workout on this day.':'No workouts in this period.')+'</p>';
  }
  return h;
}

  var more=w.exercises.length>4?'<span class="sub">+'+(w.exercises.length-4)+' more</span><span></span>':'';

function kpi(l,v){return '<div class="kpi"><small>'+l+'</small><b class="mono">'+esc(v)+'</b></div>'}
function barChart(labels,vals,mode){
  var W=320,H=150,pl=8,pr=8,pt=18,pb=22,max=Math.max.apply(null,vals.concat([mode==='count'?2:1])),bw=(W-pl-pr)/vals.length;
  var nice=mode==='count'?Math.ceil(max):max,s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weekly activity chart">';
  s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/><line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+pt+'" y2="'+pt+'"/>';
  vals.forEach(function(v,i){var h=nice?(v/nice)*(H-pb-pt):0,x=pl+i*bw+bw*.18,w=bw*.64,y=H-pb-h,last=i===vals.length-1;
    s+='<rect class="bar'+(last?' cur':'')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+Math.max(h,v>0?2:0)+'" rx="3"/>';
    if(v>0)s+='<text class="cv" x="'+(x+w/2)+'" y="'+(y-4)+'" text-anchor="middle">'+(mode==='count'?v:mode==='dur'?num(Math.round(v*10)/10):Math.round(v).toLocaleString())+'</text>';

function lineChart(pts,fmt){
  var W=320,H=160,pl=34,pr=14,pt=14,pb=24;
  var ys=pts.map(function(p){return p.y}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);if(mx===mn){mx=mn+1;mn=Math.max(0,mn-1)}
  var pad=(mx-mn)*.12;mn=Math.max(0,mn-pad);mx=mx+pad;
  var X=function(i){return pts.length===1?(pl+W-pr)/2:pl+i*(W-pl-pr)/(pts.length-1)},Y=function(v){return pt+(1-(v-mn)/(mx-mn))*(H-pt-pb)};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Progress chart">';
  [mn,(mn+mx)/2,mx].forEach(function(v){s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ct" x="'+(pl-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+esc(fmt(v))+'</text>'});
  var d=pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)}).join(' ');
  if(pts.length>1)s+='<path class="ar" d="'+d+' L'+X(pts.length-1)+' '+(H-pb)+' L'+X(0)+' '+(H-pb)+'Z"/><path class="ln" d="'+d+'"/>';
  pts.forEach(function(p,i){s+='<circle class="pt'+(i===pts.length-1?' last':'')+'" cx="'+X(i)+'" cy="'+Y(p.y)+'" r="'+(i===pts.length-1?4.5:3.2)+'"/>'});
  s+='<text class="ct" x="'+pl+'" y="'+(H-6)+'">'+fDateS(pts[0].x)+'</text>';

  return s+'</svg>';
}

var root=null;

  root.innerHTML=viewApp();

/* ---------- alarm ---------- */
var PAT={
  beep:[0,.25,.5,1.05,1.3,1.55].map(function(t){return {t:t,d:.16,f:880,w:'square',a:.55}}),
  chime:[{t:0,d:.4,f:660,w:'sine',a:.9},{t:.3,d:.8,f:990,w:'sine',a:.9},{t:1.2,d:.4,f:660,w:'sine',a:.9},{t:1.5,d:.9,f:990,w:'sine',a:.9}],
  bell:[{t:0,d:1.3,f:1320,w:'sine',a:.9},{t:0,d:.9,f:2640,w:'sine',a:.3},{t:1.4,d:1.3,f:1320,w:'sine',a:.9},{t:1.4,d:.9,f:2640,w:'sine',a:.3}]
};
var actx=null;
function alarmOpts(){var a=S.profile.alarm;return {sound:a.sound,volume:a.vol,vibrate:!!a.vibrate,duck:!!a.duck,alarmStream:a.stream!=='media'}}
function webAlarm(){
  var a=S.profile.alarm;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    var g=actx.createGain();g.gain.value=Math.max(0,Math.min(1,a.vol/100));g.connect(actx.destination);
    var t0=actx.currentTime+.05;
    (PAT[a.sound]||PAT.beep).forEach(function(n){var o=actx.createOscillator(),e=actx.createGain();o.type=n.w;o.frequency.value=n.f;o.connect(e);e.connect(g);var t=t0+n.t;e.gain.setValueAtTime(.0001,t);e.gain.exponentialRampToValueAtTime(n.a,t+.01);e.gain.exponentialRampToValueAtTime(.0001,t+n.d);o.start(t);o.stop(t+n.d+.03)});
  }catch(e){}
  if(a.vibrate&&navigator.vibrate)try{navigator.vibrate([250,120,250,120,400])}catch(e){}
}
function playAlarm(){if(NATIVE)nat('playAlarm',alarmOpts());else webAlarm()}
function startRest(sec){
  if(!(sec>0))return;
  S.rest={end:Date.now()+sec*1000,total:sec};
  if(NATIVE)nat('scheduleRest',Object.assign({seconds:sec},alarmOpts()));
}
function restReschedule(){if(!S.rest)return;var left=Math.ceil((S.rest.end-Date.now())/1000);if(left<=0){stopRest();return}if(NATIVE)nat('scheduleRest',Object.assign({seconds:left},alarmOpts()))}
function stopRest(){if(S.rest&&NATIVE)nat('cancelRest');S.rest=null}

/* ---------- screen awake ---------- */
var awake=false,wlock=null;
function wantAwake(){return !!(S.active&&S.active.kind==='workout'&&S.profile.keepAwake)}
function syncAwake(force){
  var want=wantAwake();if(want===awake&&!force)return;awake=want;
  if(NATIVE){nat('keepAwake',{on:want});return}
  try{
    if(want&&navigator.wakeLock&&document.visibilityState==='visible'){navigator.wakeLock.request('screen').then(function(l){wlock=l}).catch(function(){})}
    else if(!want&&wlock){wlock.release();wlock=null}
  }catch(e){}
}

/* ---------- now playing (Android) ---------- */
var mediaTimer=null,mediaKey='',mediaBusy=false;
function syncMediaPoll(){
  var on=NATIVE&&S.profile.showMedia&&!!$('#media')&&document.visibilityState==='visible';
  if(on&&!mediaTimer){pollMedia();mediaTimer=setInterval(pollMedia,2000)}
  else if(!on&&mediaTimer){clearInterval(mediaTimer);mediaTimer=null}

function pollMedia(){
  if(mediaBusy)return;mediaBusy=true;
  nat('nowPlaying',{artKey:S.media&&S.media.artKey||''}).then(function(m){
    mediaBusy=false;if(!m)return;
    if(m.artKey&&!m.art&&S.media&&S.media.artKey===m.artKey)m.art=S.media.art;
    S.media=m;
    var key=[m.granted,m.title,m.artist,m.playing,m.artKey].join('|');
    if(key!==mediaKey){mediaKey=key;var el=$('#media');if(el)el.innerHTML=mediaHtml(m)}
  });
}

/* ---------- tick ---------- */
function tick(){
  var now=Date.now();
  if(S.active&&S.active.kind==='workout'){
    var t=fmtClock((now-S.active.start)/1000);$$('[data-elapsed]').forEach(function(el){if(el.textContent!==t)el.textContent=t});
    var e=$('[data-est]');if(e){var x=estText();if(e.innerHTML!==x)e.innerHTML=x}
  }
  if(S.rest){var left=Math.ceil((S.rest.end-now)/1000);
    if(left<=0){S.rest=null;var r=$('#rest');if(r)r.hidden=true;if(!NATIVE)webAlarm();toast('Rest over')}
    else{var el=$('#rest-t');if(el)el.textContent=fmtClock(left);var b=$('#rest-b');if(b)b.style.width=Math.round(left/S.rest.total*100)+'%'}}
}
function updStats(){if(!S.active||S.active.kind!=='workout')return;var t=totals(S.active,true);var v=$('[data-stat="vol"]'),n=$('[data-stat="sets"]');if(v)v.textContent=fmtVol(t.vol);if(n)n.textContent=t.sets}

    case 'media-perm':nat('openMediaSettings');break;
    case 'media-open':nat('openPlayer');break;
    case 'pick-folder':nat('pickBackupFolder').then(function(r){if(r&&r.name){S.bk=Object.assign(S.bk||{},{folder:r.name,weekly:true});render();backupNow(false)}});break;
    case 'export':exportCsv();break;
    case 'backup':backupNow(false);break;
    case 'restore':{var f=$('#restore-file');if(f)f.click();break}
    default:if(a.indexOf('tg-')===0)toggleSetting(a.slice(3));
  }
}

/* ---------- files ---------- */
function downloadFile(name,text,type){
  if(NATIVE)return nat('exportFile',{name:name,mime:type,data:text}).then(function(r){return !!(r&&r.saved)});
  var blob=new Blob([text],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000);
  return Promise.resolve(true);
}
function exportCsv(){
  if(!S.workouts.length){toast('Log a workout first');return}
  var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[['title','start_time','end_time','exercise','set_number','set_type','weight_kg','reps','duration_seconds','notes']];
  S.workouts.slice().reverse().forEach(function(w){w.exercises.forEach(function(e){var ty=exOf(e.ex).type;e.sets.forEach(function(s,i){rows.push([w.name,new Date(w.start).toISOString(),new Date(w.end).toISOString(),exOf(e.ex).name,i+1,{n:'normal',w:'warmup',d:'dropset',f:'failure'}[s.t]||'normal',ty==='wr'?num(s.w||0):'',ty==='dur'?'':(s.r||0),ty==='dur'?(s.r||0):'',e.note||''])})})});
  downloadFile('lift-log.csv',rows.map(function(r){return r.map(q).join(',')}).join('\n'),'text/csv').then(function(ok){if(ok)toast('CSV saved')});
}
function backupNow(silent){
  var json=backupJson();
  if(NATIVE&&S.bk&&S.bk.folder){
    nat('backupNow',{json:json}).then(function(r){if(r&&r.ok){S.bk=Object.assign(S.bk,{lastBackup:r.time});if(!silent)toast('Backed up to '+S.bk.folder);if(S.tab==='profile')softRender()}else if(!silent)toast('Backup failed. Choose the folder again.')});
    return;
  }
  var d=new Date().toISOString().slice(0,10);
  downloadFile('lift-log-backup-'+d+'.json',json,'application/json').then(function(ok){if(ok){lsSet('lastBackup',Date.now());if(!silent)toast(NATIVE?'Backup saved':'Backup saved to your downloads');if(S.tab==='profile')softRender()}});
}
function restoreData(d){
  if(!d||d.app!=='lift-log'||!Array.isArray(d.workouts))throw new Error('bad');
  applyProfile(d.profile||{});S.workouts=d.workouts;sortW();lsSet('profile',profileData());saveWorkouts();
  toast('Restored '+S.workouts.length+' workout'+(S.workouts.length===1?'':'s'));
}
function parseCSV(t){var rows=[],row=[],f='',q=false;for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else{if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(function(r){return r.length>1})}
function importCSV(text){
  var rows=parseCSV(text.replace(/^﻿/,''));if(rows.length<2)throw new Error('empty');
  var h=rows.shift().map(function(x){return x.trim().toLowerCase()});
  var col=function(){for(var i=0;i<arguments.length;i++){var k=h.indexOf(arguments[i]);if(k>-1)return k}return -1};
  var cT=col('title'),cS=col('start_time'),cE=col('end_time'),cX=col('exercise','exercise_title'),cN=col('set_number','set_index'),cY=col('set_type'),cW=col('weight_kg'),cR=col('reps'),cD=col('duration_seconds'),cO=col('notes','exercise_notes');
  if(cS<0||cX<0)throw new Error('cols');
  var zeroBased=h[cN]==='set_index',byKey={},order=[],created=0;
  rows.forEach(function(r){
    var g=function(c){return c>-1&&r[c]!=null?String(r[c]).trim():''};
    var start=Date.parse(g(cS));if(isNaN(start))return;
    var key=g(cT)+'|'+start;
    var w=byKey[key];if(!w){var end=Date.parse(g(cE));w=byKey[key]={id:uid(),name:g(cT)||greet(start),start:start,end:isNaN(end)?start:end,note:'',exercises:[]};order.push(w)}
    var name=g(cX);if(!name)return;
    var e=allEx().filter(function(x){return x.name.toLowerCase()===name.toLowerCase()})[0];
    var wt=g(cW),dur=g(cD);
    if(!e){e={id:'c_'+uid(),name:name,muscle:'Full Body',equip:'Other',type:dur&&!wt?'dur':(wt?'wr':'reps'),sec:[]};S.profile.customEx.push(e);created++}
    var sn=parseInt(g(cN),10);var first=zeroBased?sn===0:sn===1;
    var last=w.exercises[w.exercises.length-1];
    if(!last||last.ex!==e.id||first){last={ex:e.id,note:'',sets:[]};w.exercises.push(last)}
    if(!last.note&&g(cO))last.note=g(cO);
    var st={normal:'n',warmup:'w',dropset:'d',failure:'f'}[g(cY).toLowerCase()]||'n';
    last.sets.push({t:st,w:e.type==='wr'?(parseNum(wt)||0):null,r:e.type==='dur'?(parseNum(dur)||0):(parseInt(g(cR),10)||0)});
  });
  var added=0;
  order.sort(function(a,b){return a.start-b.start}).forEach(function(w){
    if(!w.exercises.length)return;
    if(S.workouts.some(function(x){return Math.abs(x.start-w.start)<1000}))return;
    w.dur=Math.max(0,Math.round((w.end-w.start)/1000));
    S.workouts.push(w);added++;
  });
  sortW();
  S.workouts.slice().reverse().forEach(function(w){var t=totals(w,false);w.vol=t.vol;w.sets=t.sets;w.prs=calcPRs(w).length});
  if(created)saveProfile();
  saveWorkouts();
  return added;
}
function restoreFrom(file){
  var r=new FileReader();
  r.onload=function(){
    var txt=String(r.result||'');
    try{
      if(/\.csv$/i.test(file.name)||/^﻿?"?title"?,/i.test(txt)){var n=importCSV(txt);toast(n?'Imported '+n+' workout'+(n>1?'s':''):'Those workouts are already in your history');S.tab='history'}
      else restoreData(JSON.parse(txt));
      render();
    }catch(e){console.error(e);toast('That file is not a Lift Log backup or CSV export')}
  };
  r.readAsText(file);
}

/* ---------- back button (Android) ---------- */
function onBack(){
  if(S.ov.length){popOv();return}
  if(S.active&&S.sheetOpen){if(S.active.kind==='workout'){S.sheetOpen=false;render()}else{S.active=null;S.sheetOpen=false;render()}return}
  if(S.tab!=='workout'&&S.tab!=='history'){S.tab=S.workouts.length?'history':'workout';render();return}
  nat('minimize');
}

/* ---------- events ---------- */
function bind(){
  document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;act(t.dataset.act,t.dataset,t,e)});
  document.addEventListener('input',function(e){
    var t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;var A=S.active;
    if(k==='exq'){S.exq=t.value;var b=$('#ex-body');if(b)b.innerHTML=exBody();return}
    if(k==='pickq'){var o=S.ov[S.ov.length-1];if(o){o.q=t.value;refreshPick()}return}
    if(k==='avol'){S.profile.alarm.vol=+t.value;var l=$('#vol-l');if(l)l.textContent=t.value+'%';return}
    if(!A)return;
    if(k==='aname')A.name=t.value;
    else if(k==='anote')A.note=t.value;
    else if(k==='exnote')A.exercises[+t.dataset.exi].note=t.value;
    else{
      var s=A.exercises[+t.dataset.exi].sets[+t.dataset.si];
      if(k==='w'){var v=parseNum(t.value);s.w=v==null?null:fromUnit(v)}
      else if(k==='r'){var n=parseInt(t.value,10);s.r=isNaN(n)?null:n}
      else if(k==='t'){s.r=parseMS(t.value)}
      updStats();
    }
    saveActiveSoon();
  });
  document.addEventListener('change',function(e){var t=e.target;
    if(t.id==='restore-file'){if(t.files&&t.files[0])restoreFrom(t.files[0]);t.value='';return}
    if(t.id==='alarm-vol'){saveProfile();return}
    if(t.dataset&&t.dataset.in==='t'&&S.active){var s=S.active.exercises[+t.dataset.exi].sets[+t.dataset.si];t.value=s.r==null?'':fmtMS(s.r)}});
  document.addEventListener('focusin',function(e){var t=e.target;if(t&&(t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&t.type!=='range'&&t.type!=='file')))document.body.classList.add('typing')});
  document.addEventListener('focusout',function(){setTimeout(function(){var a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA)$/.test(a.tagName))document.body.classList.remove('typing')},60)});
  document.addEventListener('focusout',function(){setTimeout(function(){if(S.pending){var a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))render()}},50)});
  document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.dataset&&/^(aname|exq|pickq)$/.test(e.target.dataset.in||'')){e.target.blur()}});
  document.addEventListener('visibilitychange',function(){
    if(!document.hidden){tick();if(!NATIVE&&awake){awake=false;syncAwake()}if(NATIVE)nat('backupInfo').then(function(r){if(r){S.bk=r;weeklyCheck()}})}
    syncMediaPoll();
  });
  window.addEventListener('pagehide',function(){if(S.active&&S.active.kind==='workout')flushActive()});
  if(NATIVE&&Native.addListener)Native.addListener('back',onBack);
}
if(!NATIVE&&'serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
root=document.getElementById('root');
root.style.height='100%';
(function(){var t=document.createElement('div');t.id='toasts';t.setAttribute('aria-live','polite');document.body.appendChild(t)})();
bind();render();setInterval(tick,1000);
initStore().catch(function(e){console.error(e);S.loading=false;render()});
})();
</script>
