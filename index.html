<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lift Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* Layout concept: phone-first app column (max 560px). Four tabs along the bottom,
   the live workout is a full-height sheet that can be minimised to a resume bar. */
:root{
  --font:system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#f3f5f9; --surface:#ffffff; --surface2:#eaedf4; --line:#dde1ea;
  --fg:#12151c; --muted:#667085;
  --accent:#2f6bff; --accent-ink:#ffffff; --accent-soft:#e3ebff;
  --ok:#16a34a; --ok-soft:#dcf4e4; --warn:#b97800; --warn-soft:#fdf0d2; --danger:#d93a40; --danger-soft:#fde4e5;
  --shadow:0 1px 2px rgba(16,24,40,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d12; --surface:#151821; --surface2:#1e222d; --line:#282d3a;
  --fg:#eef0f6; --muted:#8b92a6;
  --accent:#5a8bff; --accent-ink:#0b0d12; --accent-soft:#17234a;
  --ok:#3ccf75; --ok-soft:#12301f; --warn:#f2b33d; --warn-soft:#382c10; --danger:#ff6b71; --danger-soft:#3a1517;
  --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0b0d12; --surface:#151821; --surface2:#1e222d; --line:#282d3a;
  --fg:#eef0f6; --muted:#8b92a6;
  --accent:#5a8bff; --accent-ink:#0b0d12; --accent-soft:#17234a;
  --ok:#3ccf75; --ok-soft:#12301f; --warn:#f2b33d; --warn-soft:#382c10; --danger:#ff6b71; --danger-soft:#3a1517;
  --shadow:none; color-scheme:dark;}
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);height:100%;box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;margin:0;padding:0;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;font-size:16px;color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}
.mono{font-variant-numeric:tabular-nums}
.app{position:relative;display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:600px){.app{border-inline:1px solid var(--line)}}
.main{flex:1;min-height:0;overflow-y:auto;padding:12px 16px 28px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
.ph h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.sub{color:var(--muted);font-size:13px}
.tabs{display:flex;background:var(--surface);border-top:1px solid var(--line)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;font-size:11px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent)}
.mini{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;background:var(--accent-soft);border-top:1px solid var(--line);text-align:left}
.mini .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.mini .mr{color:var(--accent);font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{min-height:36px;padding:0 14px;border-radius:10px;font-size:14px}
.btn.block{width:100%}
.btn.sec{background:var(--surface2);color:var(--fg)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.link{background:none;color:var(--danger);min-height:40px}
.btn[disabled]{opacity:.45;cursor:default}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--muted)}
.ib.acc{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:0 12px;margin-bottom:10px;color:var(--muted)}
.search input{flex:1;min-width:0;background:none;border:0;padding:12px 0;outline:0}
.field{width:100%;background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:12px 14px;outline:0}
.field:focus{border-color:var(--accent)}
label.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px;letter-spacing:.04em;text-transform:uppercase}
/* history */
.month{font-size:13px;font-weight:700;color:var(--muted);margin:20px 0 8px}
.wk{display:block;width:100%;text-align:left}
.wk h3,.rt h3{font-size:17px;font-weight:700;margin:0}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 2px;font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:700}
.stats .pr{color:var(--warn)}
.exl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;margin-top:10px;font-size:14px}
.exl span:nth-child(even){color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:34px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{margin:0;font-size:18px}
.empty p{margin:0;color:var(--muted);max-width:30ch}
.empty .ill{width:84px;height:84px;color:var(--accent)}
.skel{height:92px;border-radius:16px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);background-size:200% 100%;animation:sk 1.4s linear infinite;margin-bottom:12px}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
/* routines */
.rt .meta{color:var(--muted);font-size:13px;margin:4px 0 12px}
.rt .names{color:var(--muted);font-size:13px;margin:6px 0 0}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
/* sheets */
.sheet{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:20}
.sheet.o{z-index:30}.sheet.o2{z-index:40}.sheet.o3{z-index:50}.sheet.o4{z-index:60}
.sh{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.sh h2{margin:0;flex:1;min-width:0;text-align:center;font-size:16px;text-transform:none;letter-spacing:0;color:var(--fg);font-weight:700}
.sb{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 32px}
.clock{font-weight:700;color:var(--accent);min-width:3.4em;text-align:right}
.kpis{display:flex;gap:10px;margin-bottom:14px}
.kpi{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.kpi small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-size:18px;font-weight:800}
.title-in{width:100%;background:none;border:0;border-bottom:1px solid var(--line);outline:0;font-size:22px;font-weight:800;padding:6px 0 8px;letter-spacing:-.01em}
.title-in:focus{border-color:var(--accent)}
.note-in{width:100%;background:none;border:0;outline:0;padding:8px 0;color:var(--muted);font-size:14px}
.rest{position:sticky;top:-14px;z-index:5;display:flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:8px 8px 8px 14px;margin:0 0 14px;overflow:hidden}
.rest .t{font-weight:800;font-size:20px;min-width:3.2em}
.rest .bar{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.55);width:100%}
.rest button{background:rgba(255,255,255,.2);color:inherit;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px}
.rest .lab{flex:1;font-size:13px;font-weight:700;opacity:.9}
.ex{margin-top:14px;padding:12px 10px 10px}
.ex-h{display:flex;align-items:center;gap:6px;padding:0 4px}
.ex-n{flex:1;min-width:0;text-align:left;font-size:17px;font-weight:800;color:var(--accent)}
.ex .note-in{padding:6px 4px}
.srow{display:grid;gap:6px;align-items:center;padding:4px;border-radius:10px;margin-top:4px}
.srow.h{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted);text-align:center;margin-top:2px}
.srow.done{background:var(--ok-soft)}
.srow input{width:100%;min-width:0;text-align:center;font-weight:700;background:var(--surface2);border:1px solid transparent;border-radius:9px;padding:8px 2px;outline:0;font-variant-numeric:tabular-nums}
.srow input:focus{border-color:var(--accent)}
.srow.done input{background:transparent}
.srow input::placeholder{color:var(--muted);opacity:.55;font-weight:600}
.sn{height:34px;border-radius:9px;background:var(--surface2);font-weight:800;font-size:14px}
.sn.w{color:var(--warn)}.sn.d{color:var(--accent)}.sn.f{color:var(--danger)}
.pv{font-size:13px;color:var(--muted);text-align:center;font-weight:600;font-variant-numeric:tabular-nums;border-radius:8px;padding:8px 0}
button.pv:hover{background:var(--surface2)}
.chk{height:34px;border-radius:9px;background:var(--surface2);color:var(--muted);display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--ok);color:#fff}
.addset{width:100%;margin-top:8px;min-height:38px;border-radius:10px;background:var(--surface2);font-weight:700;font-size:14px;color:var(--fg);display:flex;align-items:center;justify-content:center;gap:6px}
/* action sheet + modal */
.scrim{position:absolute;inset:0;z-index:70;background:rgba(5,8,15,.55);display:flex;align-items:flex-end;justify-content:center}
.scrim.mid{align-items:center;padding:20px}
.panel{width:100%;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.scrim.mid .panel{border-radius:20px;padding:20px;max-width:380px;gap:12px}
.panel .opt{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:12px;font-weight:600;text-align:left;width:100%}
.panel .opt:hover{background:var(--surface2)}
.panel .opt.dng{color:var(--danger)}
.panel .opt[aria-current="true"]{color:var(--accent)}
.panel h3{margin:0;font-size:19px}
.panel p{margin:0;color:var(--muted)}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
.trophy{color:var(--warn)}
.pr-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:999px}
.pick-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 10px;border-radius:12px}
.pick-row:hover{background:var(--surface2)}
.pick-row.sel{background:var(--accent-soft)}
.badge{width:38px;height:38px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--muted);flex:none}
.pick-row.sel .badge{background:var(--accent);color:var(--accent-ink)}
.tbl{display:grid;grid-template-columns:2.4rem 1fr auto;gap:6px 10px;font-size:14px;font-variant-numeric:tabular-nums;margin-top:8px}
.tbl .hd{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.rec{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.rec .kpi b{display:block;font-size:17px}
.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:7px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ct{fill:var(--muted);font-size:9px;font-family:var(--font);font-weight:600}
.chart .cv{fill:var(--fg);font-size:9.5px;font-family:var(--font);font-weight:800}
.chart .bar{fill:var(--accent);opacity:.35}.chart .bar.cur{opacity:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}.chart .pt.last{fill:var(--accent)}
.hb{display:grid;grid-template-columns:92px 1fr 2.2rem;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.hb i{display:block;height:9px;border-radius:5px;background:var(--surface2);overflow:hidden}
.hb i b{display:block;height:100%;background:var(--accent);border-radius:5px}
.hb span:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.big .kpi b{font-size:22px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:10px;background:var(--surface2);font-weight:800;font-size:18px}
.stepper b{min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
#toasts{position:absolute;left:0;right:0;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none;padding:0 16px}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
</style>
</head>

<script>
(function(){

};
var KGU=function(){return S.profile.unit};
function toUnit(kg){return kg==null?null:(S.profile.unit==='kg'?kg:kg*KG)}
function fromUnit(v){return S.profile.unit==='kg'?v:v/KG}

function fmtClock(sec){sec=Math.max(0,Math.floor(sec));var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(s).padStart(2,'0')}

function fmtMS(sec){if(sec==null)return '';var m=Math.floor(sec/60),s=Math.round(sec%60);return m+':'+String(s).padStart(2,'0')}
function parseMS(v){v=String(v).trim();if(!v)return null;if(v.indexOf(':')>-1){var p=v.split(':');return (parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0)}var f=parseFloat(v.replace(',','.'));return isNaN(f)?null:Math.round(f*60)}
function parseNum(v){var f=parseFloat(String(v).replace(',','.'));return isNaN(f)?null:f}
var fDate=function(t){return new Date(t).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})};
var fDateS=function(t){return new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short'})};
var fTime=function(t){return new Date(t).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})};
var fMonth=function(t){return new Date(t).toLocaleDateString(undefined,{month:'long',year:'numeric'})};
function greet(t){var h=new Date(t).getHours();return (h<5?'Night':h<12?'Morning':h<17?'Afternoon':h<21?'Evening':'Night')+' Workout'}

/* ---------- exercise library ---------- */
var MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Core','Cardio','Full Body'];
var EQUIP=['Barbell','Dumbbell','Machine','Cable','Bodyweight','Kettlebell','Other'];
var TYPES={wr:'Weight & reps',reps:'Reps only',dur:'Duration'};
var LIB=[
['bench','Bench Press','Chest','Barbell'],['incbench','Incline Bench Press','Chest','Barbell'],['dbbench','Dumbbell Bench Press','Chest','Dumbbell'],
['incdb','Incline Dumbbell Press','Chest','Dumbbell'],['dbfly','Dumbbell Fly','Chest','Dumbbell'],['cablefly','Cable Fly','Chest','Cable'],
['chestpress','Machine Chest Press','Chest','Machine'],['pushup','Push-up','Chest','Bodyweight','reps'],['chestdip','Chest Dip','Chest','Bodyweight','reps'],
['deadlift','Deadlift','Back','Barbell'],['row','Barbell Row','Back','Barbell'],['dbrow','One-Arm Dumbbell Row','Back','Dumbbell'],

/* ---------- workout math ---------- */
function isWork(s){return s.t!=='w'}
function setVol(s,ty){return ty==='wr'?(s.w||0)*(s.r||0):0}
function e1rm(s){return (s.w>0&&s.r>0)?(s.r===1?s.w:s.w*(1+s.r/30)):0}
function totals(w,onlyDone){var v=0,n=0,reps=0;w.exercises.forEach(function(ex){var ty=exOf(ex.ex).type;ex.sets.forEach(function(s){if(onlyDone&&!s.done)return;n++;if(isWork(s)){v+=setVol(s,ty);if(ty!=='dur')reps+=s.r||0}})});return {vol:v,sets:n,reps:reps}}
function sessionsOf(exId,beforeStart,exceptId){var out=[];S.workouts.forEach(function(w){if(w.id===exceptId)return;if(beforeStart!=null&&w.start>=beforeStart)return;w.exercises.forEach(function(e){if(e.ex===exId)out.push({w:w,sets:e.sets})})});return out}
var prevCache=null;
function lastSets(exId){if(prevCache&&prevCache[exId])return prevCache[exId];var s=sessionsOf(exId,null,S.active&&S.active.id);var r=s.length?s[0].sets:[];if(prevCache)prevCache[exId]=r;return r}
function fmtSet(s,ty){if(!s)return '–';if(ty==='wr')return fmtW(s.w||0)+' × '+(s.r||0);if(ty==='dur')return fmtMS(s.r||0);return String(s.r||0)}
function bestSet(sets,ty){var b=null,bs=-1;sets.forEach(function(s){if(!isWork(s))return;var sc=ty==='wr'?(e1rm(s)||s.w||0):(s.r||0);if(sc>bs){bs=sc;b=s}});return b}
function calcPRs(w){
  var out=[];
  w.exercises.forEach(function(ex){
    var ty=exOf(ex.ex).type,prior=sessionsOf(ex.ex,w.start,w.id);
    ex.sets.forEach(function(s){delete s.pr});
    if(!prior.length)return;
    var bw=0,b1=0,bv=0,br=0;
    prior.forEach(function(p){p.sets.forEach(function(s){if(!isWork(s))return;bw=Math.max(bw,s.w||0);b1=Math.max(b1,e1rm(s));bv=Math.max(bv,setVol(s,'wr'));br=Math.max(br,s.r||0)})});
    ex.sets.forEach(function(s){
      if(!isWork(s))return;var k=[];
      if(ty==='wr'){
        if((s.r||0)>0){if((s.w||0)>bw)k.push('Weight');if(e1rm(s)>b1+1e-9)k.push('1RM');if(setVol(s,'wr')>bv+1e-9)k.push('Volume')}
        bw=Math.max(bw,s.w||0);b1=Math.max(b1,e1rm(s));bv=Math.max(bv,setVol(s,'wr'));
      }else{if((s.r||0)>br)k.push(ty==='dur'?'Time':'Reps');br=Math.max(br,s.r||0)}
      if(k.length){s.pr=k;out.push({ex:ex.ex,s:s,k:k})}
    });
  });
  return out;
}

function weekStart(t){var d=new Date(t);d.setHours(0,0,0,0);var day=(d.getDay()+6)%7;d.setDate(d.getDate()-day);return d.getTime()}

  ws.forEach(function(w){var k=weekStart(w.start);weeks.forEach(function(x){if(x.t===k){x.n++;x.dur+=(w.dur||0);x.vol+=(w.vol||0)}})});
  var key={count:'n',dur:'dur',vol:'vol'}[S.pm];

function kpi(l,v){return '<div class="kpi"><small>'+l+'</small><b class="mono">'+esc(v)+'</b></div>'}
function barChart(labels,vals,mode){
  var W=320,H=150,pl=8,pr=8,pt=18,pb=22,max=Math.max.apply(null,vals.concat([mode==='count'?2:1])),bw=(W-pl-pr)/vals.length;
  var nice=mode==='count'?Math.ceil(max):max,s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weekly activity chart">';
  s+='<line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'"/><line class="grid" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+pt+'" y2="'+pt+'"/>';
  vals.forEach(function(v,i){var h=nice?(v/nice)*(H-pb-pt):0,x=pl+i*bw+bw*.18,w=bw*.64,y=H-pb-h,last=i===vals.length-1;
    s+='<rect class="bar'+(last?' cur':'')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+Math.max(h,v>0?2:0)+'" rx="3"/>';
    if(v>0)s+='<text class="cv" x="'+(x+w/2)+'" y="'+(y-4)+'" text-anchor="middle">'+(mode==='count'?v:mode==='dur'?num(Math.round(v*10)/10):Math.round(v).toLocaleString())+'</text>';
    s+='<text class="ct" x="'+(x+w/2)+'" y="'+(H-7)+'" text-anchor="middle">'+esc(labels[i])+'</text>'});
  return s+'</svg>';
}
function lineChart(pts,fmt){
  var W=320,H=160,pl=34,pr=14,pt=14,pb=24;
  var ys=pts.map(function(p){return p.y}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);if(mx===mn){mx=mn+1;mn=Math.max(0,mn-1)}
  var pad=(mx-mn)*.12;mn=Math.max(0,mn-pad);mx=mx+pad;

  switch(a){
    case 'tab':S.tab=d.id;render();break;
    case 'open-sheet':S.sheetOpen=true;render();break;
    case 'min-sheet':S.sheetOpen=false;render();break;
    case 'start-empty':startWorkout(null);break;
    case 'start-routine':startWorkout(S.profile.routines.filter(function(r){return r.id===d.id})[0]);break;
    case 'discard-ask':pushOv({t:'confirm',title:'Discard workout?',body:'Everything you logged in this workout will be lost.',ok:'Discard',danger:true,go:'discard'});break;
    case 'new-routine':if(S.active){toast('Finish or discard your current workout first');break}S.active={kind:'routine',rid:null,name:'',exercises:[]};S.sheetOpen=true;render();break;
    case 'routine-menu':pushOv({t:'rmenu',id:d.id});break;
    case 'routine-edit':{var r=S.profile.routines.filter(function(x){return x.id===d.id})[0];if(!r)break;if(S.active){S.ov=[];toast('Finish or discard your current workout first');render();break}
      S.ov=[];S.active={kind:'routine',rid:r.id,name:r.name,exercises:r.exercises.map(function(e){return {id:uid(),ex:e.ex,note:'',sets:e.sets.map(function(s){return {t:s.t||'n',w:s.w==null?null:s.w,r:s.r==null?null:s.r}})}})};S.sheetOpen=true;render();break}
    case 'routine-dup':{var r2=S.profile.routines.filter(function(x){return x.id===d.id})[0];if(!r2)break;var c=clean(r2);c.id='r_'+uid();c.name+=' copy';S.profile.routines.push(c);saveProfile();S.ov=[];render();toast('Routine duplicated');break}
    case 'routine-del':S.ov=[{t:'confirm',title:'Delete routine?',body:'This removes the routine. Logged workouts are not affected.',ok:'Delete',danger:true,go:'del-routine',id:d.id}];render();break;
    case 'del-routine-ask':if(A&&A.rid)pushOv({t:'confirm',title:'Delete routine?',body:'This removes the routine. Logged workouts are not affected.',ok:'Delete',danger:true,go:'del-routine',id:A.rid});break;
    case 'cancel-routine':S.active=null;S.sheetOpen=false;render();break;
    case 'save-routine':{
      if(!A.exercises.length){toast('Add at least one exercise');break}
      var rr={id:A.rid||'r_'+uid(),name:(A.name||'').trim()||'New routine',exercises:A.exercises.map(function(e){return {ex:e.ex,sets:e.sets.map(function(s){return {t:s.t,w:s.w,r:s.r}})}})};
      var ix=S.profile.routines.findIndex(function(x){return x.id===rr.id});if(ix>-1)S.profile.routines[ix]=rr;else S.profile.routines.push(rr);
      saveProfile();S.active=null;S.sheetOpen=false;S.tab='workout';render();toast('Routine saved');break}
    case 'add-ex':pushOv({t:'pick',sel:[],q:'',m:'All'});break;
    case 'pick-toggle':{var o=S.ov[S.ov.length-1],k=o.sel.indexOf(d.id);if(k>-1)o.sel.splice(k,1);else o.sel.push(d.id);refreshPick();break}
    case 'pickm':{var o2=S.ov[S.ov.length-1];o2.m=d.m;refreshPick();break}
    case 'exm':S.exm=d.m;var eb=$('#ex-body');if(eb)eb.innerHTML=exBody();break;
    case 'pick-add':{var o3=S.ov[S.ov.length-1];if(!o3.sel.length)break;var isW=A.kind==='workout';o3.sel.forEach(function(id){A.exercises.push(newExEntry(id,isW))});S.ov.pop();saveActiveSoon();render();break}
    case 'new-ex':pushOv({t:'newex'});break;
    case 'save-ex':{
      var nm=($('#nx-name').value||'').trim();if(!nm){toast('Give the exercise a name');break}
      var ne={id:'c_'+uid(),name:nm,muscle:$('#nx-muscle').value,equip:$('#nx-equip').value,type:$('#nx-type').value};
      S.profile.customEx.push(ne);saveProfile();S.ov.pop();var top=S.ov[S.ov.length-1];if(top&&top.t==='pick')top.sel.push(ne.id);render();toast('Exercise created');break}
    case 'exopen':pushOv({t:'exdetail',id:d.id});break;
    case 'metric':S.ov[S.ov.length-1].metric=d.id;render();break;
    case 'ex-custom-del':S.profile.customEx=S.profile.customEx.filter(function(x){return x.id!==d.id});saveProfile();S.ov.pop();render();break;
    case 'ov-close':popOv();break;
    case 'scrim':if(e.target===t)popOv();break;
    case 'confirm-ok':{var o4=S.ov[S.ov.length-1];S.ov.pop();
      if(o4.go==='discard'){clearActive()}
      else if(o4.go==='finish-go'){finishGo();return}
      else if(o4.go==='del-routine'){S.profile.routines=S.profile.routines.filter(function(x){return x.id!==o4.id});saveProfile();if(S.active&&S.active.kind==='routine'){S.active=null;S.sheetOpen=false}toast('Routine deleted')}
      else if(o4.go==='del-workout'){deleteWorkout(o4.id);S.ov=[];toast('Workout deleted')}
      render();break}
    case 'add-set':{var ex=A.exercises[+d.exi],last=ex.sets[ex.sets.length-1];ex.sets.push({t:'n',w:null,r:null,done:false});if(last&&A.kind==='routine'){var ns=ex.sets[ex.sets.length-1];ns.w=last.w;ns.r=last.r}saveActiveSoon();render();break}
    case 'set-menu':pushOv({t:'setmenu',exi:+d.exi,si:+d.si});break;
    case 'set-type':{var o5=S.ov[S.ov.length-1];A.exercises[o5.exi].sets[o5.si].t=d.t;S.ov.pop();saveActiveSoon();render();break}
    case 'set-del':{var o6=S.ov[S.ov.length-1],ex6=A.exercises[o6.exi];ex6.sets.splice(o6.si,1);S.ov.pop();saveActiveSoon();render();break}
    case 'ex-menu':pushOv({t:'exmenu',exi:+d.exi});break;
    case 'ex-up':case 'ex-down':{var o7=S.ov[S.ov.length-1],i=o7.exi,j=a==='ex-up'?i-1:i+1,arr=A.exercises,tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;S.ov.pop();saveActiveSoon();render();break}
    case 'ex-del':{var o8=S.ov[S.ov.length-1];A.exercises.splice(o8.exi,1);S.ov.pop();saveActiveSoon();render();break}
    case 'fill-prev':{var ex9=A.exercises[+d.exi],s9=ex9.sets[+d.si],p9=lastSets(ex9.ex)[+d.si];if(p9){if(p9.w!=null)s9.w=p9.w;if(p9.r!=null)s9.r=p9.r;saveActiveSoon();render()}break}
    case 'done':{
      var exd=A.exercises[+d.exi],sd=exd.sets[+d.si],ty=exOf(exd.ex).type;
      if(!sd.done){
        var pv=lastSets(exd.ex)[+d.si]||(+d.si>0?exd.sets[+d.si-1]:null);
        if(sd.w==null&&ty==='wr'&&pv&&pv.w!=null)sd.w=pv.w;
        if(sd.r==null&&pv&&pv.r!=null)sd.r=pv.r;
        if(!(sd.r>0)){toast(ty==='dur'?'Enter a time first':'Enter reps first');break}
        if(ty==='wr'&&sd.w==null)sd.w=0;
        sd.done=true;
        if(S.profile.rest>0)S.rest={end:Date.now()+S.profile.rest*1000,total:S.profile.rest};
      }else sd.done=false;
      saveActiveSoon();render();break}
    case 'rest-adj':if(S.rest){S.rest.end+=(+d.d)*1000;S.rest.total=Math.max(S.rest.total,Math.ceil((S.rest.end-Date.now())/1000));if(S.rest.end<=Date.now())S.rest=null;render()}break;
    case 'rest-skip':S.rest=null;render();break;
    case 'finish':{
      var done=0,open=0;A.exercises.forEach(function(e){e.sets.forEach(function(s){if(s.done)done++;else open++})});
      if(!done){pushOv({t:'confirm',title:'No completed sets',body:'Tap the checkmark on a set to log it, or discard this workout.',ok:'Keep logging',cancelOnly:true});break}
      if(open){pushOv({t:'confirm',title:'Finish workout?',body:open+' set'+(open>1?'s are':' is')+' not marked done and will be left out.',ok:'Finish',go:'finish-go'});break}
      finishGo();break}
    case 'wopen':pushOv({t:'wdetail',id:d.id});break;
    case 'wdel-ask':pushOv({t:'confirm',title:'Delete workout?',body:'This removes it from your history and records.',ok:'Delete',danger:true,go:'del-workout',id:d.id});break;
    case 'repeat':{var w=S.workouts.filter(function(x){return x.id===d.id})[0];if(!w)break;if(S.active){toast('Finish or discard your current workout first');break}S.ov=[];startWorkout({name:w.name,exercises:w.exercises});break}
    case 'save-as-routine':{var w2=S.workouts.filter(function(x){return x.id===d.id})[0];if(!w2)break;S.profile.routines.push(routineFromWorkout(w2));saveProfile();toast('Saved to Routines');break}
    case 'pm':S.pm=d.id;render();break;
    case 'unit':S.profile.unit=d.id;saveProfile();render();break;
    case 'rest-def':S.profile.rest=Math.max(0,Math.min(600,S.profile.rest+(+d.d)));saveProfile();render();break;
    case 'export':exportCsv();break;
    case 'backup':backup();break;
    case 'restore':{var f=$('#restore-file');if(f)f.click();break}
  }
}
function saveFile(name,text,type){
  var blob=new Blob([text],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000);
}
function exportCsv(){
  if(!S.workouts.length){toast('Log a workout first');return}
  var q=function(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=[['title','start_time','end_time','exercise','set_number','set_type','weight_kg','reps','duration_seconds','notes']];
  S.workouts.slice().reverse().forEach(function(w){w.exercises.forEach(function(e){var ty=exOf(e.ex).type;e.sets.forEach(function(s,i){rows.push([w.name,new Date(w.start).toISOString(),new Date(w.end).toISOString(),exOf(e.ex).name,i+1,{n:'normal',w:'warmup',d:'dropset',f:'failure'}[s.t]||'normal',ty==='wr'?num(s.w||0):'',ty==='dur'?'':(s.r||0),ty==='dur'?(s.r||0):'',e.note||''])})})});
  saveFile('lift-log.csv',rows.map(function(r){return r.map(q).join(',')}).join('\n'),'text/csv');
}
function backup(){
  var d=new Date().toISOString().slice(0,10);
  saveFile('lift-log-backup-'+d+'.json',JSON.stringify({app:'lift-log',v:1,profile:profileData(),workouts:S.workouts}),'application/json');
  toast('Backup saved to your downloads');
}
function restoreFrom(file){
  var r=new FileReader();
  r.onload=function(){try{
    var d=JSON.parse(r.result);if(d.app!=='lift-log'||!Array.isArray(d.workouts))throw 0;
    var p=d.profile||{};S.profile.unit=p.unit||'kg';S.profile.rest=p.rest==null?90:p.rest;S.profile.customEx=p.customEx||[];S.profile.routines=p.routines||[];
    S.workouts=d.workouts;sortW();lsSet('profile',profileData());lsSet('workouts',S.workouts);render();toast('Restored '+S.workouts.length+' workouts');
  }catch(e){toast('That file is not a Lift Log backup')}};
  r.readAsText(file);
}

/* ---------- events ---------- */
function bind(){
  document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;act(t.dataset.act,t.dataset,t,e)});
  document.addEventListener('input',function(e){
    var t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;var A=S.active;
    if(k==='exq'){S.exq=t.value;var b=$('#ex-body');if(b)b.innerHTML=exBody();return}
    if(k==='pickq'){var o=S.ov[S.ov.length-1];if(o){o.q=t.value;refreshPick()}return}
    if(!A)return;
    if(k==='aname')A.name=t.value;
    else if(k==='anote')A.note=t.value;
    else if(k==='exnote')A.exercises[+t.dataset.exi].note=t.value;
    else{
      var s=A.exercises[+t.dataset.exi].sets[+t.dataset.si];
      if(k==='w'){var v=parseNum(t.value);s.w=v==null?null:fromUnit(v)}
      else if(k==='r'){var n=parseInt(t.value,10);s.r=isNaN(n)?null:n}
      else if(k==='t'){s.r=parseMS(t.value)}
      updStats();
    }
    saveActiveSoon();
  });
  document.addEventListener('change',function(e){var t=e.target;if(t.id==='restore-file'){if(t.files&&t.files[0])restoreFrom(t.files[0]);t.value='';return}if(t.dataset&&t.dataset.in==='t'&&S.active){var s=S.active.exercises[+t.dataset.exi].sets[+t.dataset.si];t.value=s.r==null?'':fmtMS(s.r)}});
  document.addEventListener('focusout',function(){setTimeout(function(){if(S.pending){var a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))render()}},50)});
  document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.dataset&&/^(aname|exq|pickq)$/.test(e.target.dataset.in||'')){e.target.blur()}});
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
root=document.getElementById('root');
root.style.height='100%';
bind();render();setInterval(tick,1000);
initStore().catch(function(e){console.error(e);S.loading=false;render()});
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});
window.addEventListener('pagehide',function(){if(S.active&&S.active.kind==='workout')flushActive()});
})();
</script>
